<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Seven Sins</title>
  <meta name="description" content="Understand the seven deadly sins through six lenses (Modern, Hinduism, Upanishads, Christianity, Buddhism and Philosophical) and learn how to leave them behind.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">&larr; All sins</a>
    <p>That sin isn't available yet.</p>
  </main>
  <script>
    const TOPICS = {"Pride":["what-it-is","root-causes","effects","how-to-overcome","stories"],"Greed":["what-it-is","root-causes","effects","how-to-overcome","stories"],"Lust":["what-it-is","root-causes","effects","how-to-overcome","stories"],"Envy":["what-it-is","root-causes","effects","how-to-overcome","stories"],"Gluttony":["what-it-is","root-causes","effects","how-to-overcome","stories"],"Wrath":["what-it-is","root-causes","effects","how-to-overcome","stories"],"Sloth":["what-it-is","root-causes","effects","how-to-overcome","stories"]};
    const LENSES = ["modern","hinduism","upanishads","christianity","buddhism","philosophical"];
    const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const q = new URLSearchParams(location.search);
    const id = q.get("id");
    if (Object.hasOwn(TOPICS, id)) {
      const topic = TOPICS[id].includes(q.get("topic")) ? q.get("topic") : TOPICS[id][0];
      const lens = [q.get("lens"), get("lens")].find(l => LENSES.includes(l)) || LENSES[0];
      location.replace(id + "/" + topic + "/" + lens + ".html");
    }
  </script>
</body>
</html>
