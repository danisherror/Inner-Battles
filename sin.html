<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&larr; All sins</a>
    <h1 class="sin-title" id="title"></h1>
    <p class="sin-tag" id="tag"></p>
    <div class="topics" id="topics"></div>
    <div class="lenses" id="lenses" role="tablist"></div>
    <article class="md" id="article">Loading...</article>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const el = id => document.getElementById(id);
    let data, sin, topic, lens;

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    fetch("sins.json").then(r => r.json()).then(d => {
      data = d;
      sin = d.sins.find(s => s.id === params.get("id") && s.topics);
      if (!sin) { el("title").textContent = "Not found"; el("article").innerHTML = "<p>That sin isn't available yet.</p>"; return; }
      topic = sin.topics.find(t => t.id === params.get("topic")) || sin.topics[0];
      lens = d.lenses.find(l => l.id === (params.get("lens") || store.get("lens"))) || d.lenses[0];
      document.title = sin.name + " - The Seven Sins";
      el("title").textContent = sin.name;
      el("tag").textContent = sin.tagline;
      render();
    });

    function render() {
      el("topics").innerHTML = sin.topics.map(t =>
        `<button class="${t.id === topic.id ? "on" : ""}" data-topic="${t.id}">${t.title}</button>`).join("");
      el("lenses").innerHTML = data.lenses.map(l =>
        `<button role="tab" aria-selected="${l.id === lens.id}" class="${l.id === lens.id ? "on" : ""}" data-lens="${l.id}">${l.name}</button>`).join("");
      history.replaceState(null, "", `?id=${sin.id}&topic=${topic.id}&lens=${lens.id}`);
      store.set("lens", lens.id);
      load();
    }

    function load() {
      el("article").innerHTML = "Loading...";
      fetch(`${sin.id}/${topic.id}/${lens.id}.md`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(md => { el("article").innerHTML = `<h2>${topic.title}</h2>` + marked.parse(md); })
        .catch(() => { el("article").innerHTML = "<p>This article isn't written yet.</p>"; });
    }

    document.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.topic) topic = sin.topics.find(t => t.id === b.dataset.topic);
      else if (b.dataset.lens) lens = data.lenses.find(l => l.id === b.dataset.lens);
      else return;
      render();
    });
  </script>
</body>
</html>
