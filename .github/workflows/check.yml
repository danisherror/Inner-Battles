# The generated HTML is committed and served as it is, so a Markdown or build.js change
# that is pushed without `npm run render` would leave stale pages live. This fails the push instead.
# It also runs the linters and the unit tests.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v5 of both actions runs on Node 24; v4 targeted the deprecated Node 20
      # (https://github.com/actions/setup-node/releases/tag/v5.0.0, https://github.com/actions/checkout/releases/tag/v5.0.0).
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
